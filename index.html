<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スロ収支">
<meta name="theme-color" content="#0c0c0c">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>パチスロ収支</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 黒い地に白い数字。会員カードの黒をそのまま画面の色にする。色分けはせず、符号と形で区別する。白版にも切り替え可。 */
:root{
  color-scheme:dark;
  --bg:#0c0c0c; --surface:#18181a; --raised:#242427; --elev:#1f1f22; --line:#2c2c30; --line-2:#45454a;
  --fg:#f4f4f2; --fg-2:#aaaaa6; --fg-3:#8c8c8f;
  --red:#f0585f; --red-bg:rgba(240,88,95,.15);
  --gold:#d3b062; --gold-bg:rgba(211,176,98,.15);
  --stage:#000000; --bezel:#2a2a2d; --scrim:rgba(0,0,0,.62);
  --shadow:0 0 0 1px #2c2c30,0 18px 30px -18px rgba(0,0,0,.8);
  --page:var(--stage);
  --font-jp:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  --font-num:"Rajdhani","Helvetica Neue","Arial Narrow",system-ui,sans-serif; --num-w:600; --num-s:1.04; --num-ls:.01em;
  --safe-t:62px; --safe-b:22px; --top-pad:4px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#ffffff; --surface:#f5f5f3; --raised:#ebebe8; --elev:#ffffff; --line:#e4e4e0; --line-2:#c9c9c4;
  --fg:#121211; --fg-2:#55554f; --fg-3:#6f6f6a;
  --red:#b5232b; --red-bg:rgba(181,35,43,.08);
  --gold:#80621e; --gold-bg:rgba(128,98,30,.11);
  --stage:#ecece9; --bezel:#19191a; --scrim:rgba(18,18,17,.46);
  --shadow:0 18px 30px -18px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.14);
}
@media (max-width:860px){ :root{ --page:var(--bg); --safe-t:0px; --safe-b:0px; --top-pad:max(4px,calc(16px - env(safe-area-inset-top,0px))) } }

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
:root{background:var(--page)}
body{background:var(--page);color:var(--fg);font-family:var(--font-jp);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}

/* ---------- stage (PC): 左に説明、右に端末 ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;align-items:start;max-width:1120px;margin-inline:auto;padding-block:24px;padding-inline:24px}
.notes{display:flex;flex-direction:column;gap:28px;max-width:520px;padding-block:16px}
.notes h1{font-size:28px;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.notes h2{font-size:13px;font-weight:700;color:var(--fg-2);letter-spacing:.08em;margin-bottom:10px}
.notes .lede{color:var(--fg-2);font-size:15px;line-height:1.8;margin-top:10px}
.notes li{position:relative;padding-left:14px;color:var(--fg-2);line-height:1.7}
.notes li::before{content:"";position:absolute;left:0;top:.8em;width:5px;height:1px;background:var(--fg-3)}
.notes li b{color:var(--fg);font-weight:500}
.notes .row{display:flex;flex-wrap:wrap;gap:8px}
.notes .meta{color:var(--fg-3);font-size:12px}
.eyebrow{font-size:12px;color:var(--fg-3);letter-spacing:.06em}
.device-wrap{position:sticky;top:24px;width:calc(422px*var(--s,1));height:calc(894px*var(--s,1))}
.device{position:relative;width:422px;height:894px;border:10px solid var(--bezel);border-radius:58px;overflow:hidden;background:var(--bg);transform:scale(var(--s,1));transform-origin:top left;box-shadow:0 30px 60px -24px rgba(0,0,0,.45)}
.island{position:absolute;z-index:60;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
.statusbar{position:absolute;z-index:59;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 44px;font-family:-apple-system,"Helvetica Neue",system-ui,sans-serif;font-weight:600;font-size:16px;pointer-events:none}
.statusbar svg{width:26px;height:13px}
.homebar{position:absolute;z-index:60;bottom:8px;left:50%;width:138px;height:5px;margin-left:-69px;border-radius:3px;background:var(--fg);opacity:.85;pointer-events:none}
@media (max-width:860px){
  .stage{display:block;height:100%;max-width:none;padding:0}
  .notes,.island,.statusbar,.homebar{display:none}
  .device-wrap{position:static;width:100%;height:100%}
  .device{width:100%;height:100%;border:0;border-radius:0;transform:none;box-shadow:none}
}

/* ---------- app shell ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-t);background:var(--bg)}
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:var(--top-pad) 16px 28px;display:flex;flex-direction:column;gap:14px}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 6px calc(6px + var(--safe-b));background:var(--bg);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center;font-size:10.5px;color:var(--fg-3);font-weight:500}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--fg)}
.tab.add span.fab{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--fg);color:var(--bg)}
.tab.add svg{stroke-width:2.2}
.tab.add{color:var(--fg-2);gap:3px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{font-size:22px;font-weight:700;line-height:1.25}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--fg-2);white-space:nowrap}
.pill.warn{background:var(--gold-bg);color:var(--gold)}
.pill.neg{background:var(--red-bg);color:var(--red)}

.num{font-family:var(--font-num);font-variant-numeric:tabular-nums lining-nums;font-weight:var(--num-w);letter-spacing:var(--num-ls);white-space:nowrap}
.num .nv{font-size:calc(1em*var(--num-s))}
.num i{font-style:normal;font-family:var(--font-jp);font-weight:500;font-size:.62em;margin-left:.12em;opacity:.8}
.num .arw{font-size:.42em;margin-right:.4em;vertical-align:.38em}
.num.zero{color:var(--fg-2)}
.muted{color:var(--fg-3)} .sub{color:var(--fg-2);font-size:12px}

.card{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card > header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2,.sec-h{font-size:13px;font-weight:700;color:var(--fg-2);letter-spacing:.04em}
.more-link{font-size:12px;color:var(--fg);font-weight:700;min-height:28px;display:inline-flex;align-items:center}

/* hero */
.hero{display:flex;flex-direction:column;gap:6px;padding:6px 0 2px}
.hero .lab{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2)}
.hero .big{font-size:50px;line-height:1.05}
.ledger{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:16px}
.ledger > div{padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ledger > div + div{border-left:1px solid var(--line)}
.ledger .k{font-size:11.5px;color:var(--fg-3);display:flex;align-items:center;gap:6px}
.ledger .v{font-size:22px}
.ledger .d{font-size:11.5px;color:var(--fg-2)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.cash{background:var(--fg)} .dot.medal{background:var(--gold)}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.kv3 > div{display:flex;flex-direction:column;gap:1px;min-width:0}
.kv3 > div + div{padding-left:12px;border-left:1px solid var(--line)}
.kv3 .k{font-size:11px;color:var(--fg-3)} .kv3 .v{font-size:17px}

.bar{height:8px;border-radius:4px;background:var(--raised);overflow:hidden}
.bar > span{display:block;height:100%;border-radius:4px;background:var(--fg)}
.bar.warn > span{background:var(--gold)} .bar.over > span{background:var(--red)}
.rowsb{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;text-align:left;width:100%;min-height:52px}
.item + .item{border-top:1px solid var(--line)}
.item .dt{min-width:38px;text-align:center;font-family:var(--font-num);font-weight:var(--num-w);font-size:calc(17px*var(--num-s));line-height:1.1}
.item .dt small{display:block;font-family:var(--font-jp);font-weight:400;font-size:10.5px;color:var(--fg-3)}
.item .tt{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ss{font-size:11.5px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rr{text-align:right;font-size:16px}
.item .rr small{display:block;font-size:10.5px;color:var(--fg-3);font-family:var(--font-jp)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--raised);border-radius:10px;padding:3px}
.seg button{min-height:34px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--elev);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.14)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14px}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn.line{border:1px solid var(--line-2);color:var(--fg);font-weight:500}
.btn.danger{color:var(--red);border:1px solid var(--line-2);font-weight:500}
.btn.sm{min-height:36px;font-size:12.5px;padding:0 12px;border-radius:10px}
.btn.block{width:100%}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 12px;color:var(--fg-2)}
.empty b{color:var(--fg);font-size:16px}
.note{font-size:11.5px;color:var(--fg-3);line-height:1.7}
.banner{font-size:12px;line-height:1.6;padding:10px 12px;border-radius:10px;background:var(--gold-bg);color:var(--gold)}
.banner.err{background:var(--red-bg);color:var(--red)}

/* calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between}
.cal-nav button{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.cal-nav svg,.sh-head svg,.chev{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal-nav b{font-family:var(--font-num);font-size:calc(20px*var(--num-s));font-weight:var(--num-w)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wd{font-size:10.5px;color:var(--fg-3);text-align:center;padding:4px 0}
.cal .c{aspect-ratio:1/1;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:0;font-family:var(--font-num)}
.cal .c .dn{font-size:12.5px;font-weight:500;color:var(--fg-2);line-height:1.2}
.cal .c .am{font-size:calc(10.5px*var(--num-s));font-weight:var(--num-w);line-height:1.15;letter-spacing:0}
.cal .c .mk{font-size:6px;line-height:1}
.cal .c.out{visibility:hidden}
.cal .c.win{background:var(--fg);color:var(--bg)} .cal .c.win .dn{color:inherit;opacity:.72}
.cal .c.lose{box-shadow:inset 0 0 0 1px var(--line-2)} .cal .c.draw{background:var(--raised)}
.cal .c.today .dn{border-radius:999px;min-width:20px;text-align:center;box-shadow:0 0 0 1.5px currentColor;opacity:1}
.cal .c.future .dn{color:var(--fg-3);opacity:.5}

/* analysis */
.dl{display:flex;flex-direction:column}
.dl > div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0}
.dl > div + div{border-top:1px solid var(--line)}
.dl dt{font-size:12.5px;color:var(--fg-2)}
.dl dt small{display:block;font-size:10.5px;color:var(--fg-3)}
.dl dd{font-size:16px;text-align:right}
.dl dd small{display:block;font-size:10.5px;color:var(--fg-3);font-family:var(--font-jp);font-weight:400}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{stroke:var(--line);stroke-width:1} .chart .zero{stroke:var(--fg-3);stroke-width:1;stroke-dasharray:2 3}
.chart text{font-family:var(--font-num);font-size:10px;fill:var(--fg-3);font-weight:500}
.chart .bp{fill:var(--fg)} .chart .bn{fill:var(--fg);opacity:.36}
.chart .tp,.chart .tn{fill:var(--fg-2)}
.chart .ln{fill:none;stroke:var(--fg);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--fg);opacity:.06}
.chart .pt{fill:var(--fg);stroke:var(--surface);stroke-width:2}
.rank{display:flex;flex-direction:column;gap:12px}
.rank .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.rank .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .nm{display:flex;align-items:baseline;gap:6px}.rank .nm > span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.rank .nm small{font-weight:400;color:var(--fg-3);font-size:11px;flex:none}
.rank .vv{font-size:15px}
.rank .tr{grid-column:1/-1;height:4px;border-radius:2px;background:var(--raised);position:relative}
.rank .tr span{position:absolute;top:0;bottom:0;border-radius:2px}
.rank .tr .p{left:50%;background:var(--fg)} .rank .tr .m{right:50%;background:var(--fg);opacity:.36}

/* sheets */
.sheet{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg);padding-top:var(--safe-t)}
.sheet.enter{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet.enter{animation:none}}
.sh-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line)}
.sh-head h2{font-size:15px;font-weight:700;text-align:center}
.sh-head button{width:44px;height:44px;display:grid;place-items:center}
.sh-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
.sh-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px calc(10px + var(--safe-b));background:var(--bg);border-top:1px solid var(--line)}
.sh-foot .res{display:flex;flex-direction:column;min-width:0}
.sh-foot .res .k{font-size:10.5px;color:var(--fg-3)} .sh-foot .res .v{font-size:24px;line-height:1.1}
.sh-foot .res .d{font-size:11px;color:var(--fg-2)}
.sh-foot .btn{min-width:112px}

.flabel{font-size:12px;color:var(--fg-2);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 13px;border-radius:999px;background:var(--raised);font-size:13px;color:var(--fg-2);display:inline-flex;align-items:center;gap:4px;max-width:100%}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
.chip.ghost{background:none;border:1px dashed var(--line-2)}
.chip.xs{min-height:30px;padding:0 10px;font-size:12px}
.hint{font-size:11.5px;color:var(--fg-3);line-height:1.6}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:12px;padding:0 14px;min-height:50px}
.frow > span{font-size:13px;color:var(--fg-2);flex:none}
.frow input{flex:1;min-width:0;text-align:right;background:none;border:0;font-size:16px;padding:10px 0}
.frow input[type="date"]{font-family:var(--font-num);font-weight:var(--num-w)}
.nf{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:0 14px}
.nf > span:first-child{font-size:13px;color:var(--fg-2);flex:none}
.nfi{display:flex;align-items:baseline;gap:4px;flex:1;min-width:0;justify-content:flex-end}
.nfi input{width:100%;min-width:0;text-align:right;background:none;border:0;font-family:var(--font-num);font-weight:var(--num-w);font-size:max(16px,calc(22px*var(--num-s)));padding:8px 0;font-variant-numeric:tabular-nums}
.nfi input::placeholder{color:var(--fg-3);opacity:.6}
.nfi i{font-style:normal;font-size:12px;color:var(--fg-3);flex:none}
.frow input:focus,.nfi input:focus,.field textarea:focus,.field input:focus{outline:none}
.nf:focus-within,.frow:focus-within{box-shadow:inset 0 0 0 2px var(--fg);border-radius:12px}
.pcard,.settle{background:var(--surface);border-radius:16px;display:flex;flex-direction:column}
.pcard > header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 0}
.pno{font-size:11px;font-weight:700;color:var(--fg-3);letter-spacing:.08em}
.pcard > header button{font-size:12px;color:var(--fg-3);min-height:32px;padding:0 6px}
.mpick{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:8px 14px 12px;font-size:16px;font-weight:700;min-height:48px;width:100%}
.mpick.none{color:var(--fg-3)}
.mpick small{display:block;font-size:11px;font-weight:400;color:var(--fg-3)}
.pcard .nf,.settle .nf,.settle .srow{border-top:1px solid var(--line)}
.sub-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;justify-content:flex-end}
.pres{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:11px 14px;border-top:1px solid var(--line);background:var(--raised);border-radius:0 0 16px 16px;font-size:12px;color:var(--fg-2)}
.pres .num{font-size:15px}
.settle h3{font-size:13px;font-weight:700;color:var(--fg-2);padding:12px 14px 10px}
.srow{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;font-size:13px;color:var(--fg-2)}
.srow .num{font-size:18px;color:var(--fg)}
.flow{padding:12px 14px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.flowbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--raised);gap:2px}
.flowbar span{display:block;height:100%;min-width:0}
.flowbar .x{background:var(--fg)} .flowbar .s{background:var(--gold)} .flowbar .l{background:var(--fg-3);opacity:.5}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:block}
.field{display:flex;flex-direction:column;gap:6px}
.field textarea,.field input{background:var(--surface);border:0;border-radius:12px;padding:12px 14px;font-size:16px;min-height:48px;resize:none;width:100%}
.field:focus-within textarea,.field:focus-within input{box-shadow:inset 0 0 0 2px var(--fg)}
.linkbtn{font-size:13px;color:var(--fg);font-weight:700;min-height:40px;text-align:left}

/* day detail */
.sess{background:var(--surface);border-radius:16px;display:flex;flex-direction:column}
.sess > header{padding:14px 16px 10px;display:flex;flex-direction:column;gap:2px}
.sess > header b{font-size:15px}
.pl{padding:11px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
.pl .nm{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .nm small{color:var(--fg-3);font-weight:700;font-size:10.5px;margin-right:6px}
.pl .yy{font-size:16px;text-align:right}
.pl .ex{grid-column:1/-1;font-size:11.5px;color:var(--fg-3);line-height:1.6}
.tot{padding:6px 16px 10px;border-top:1px solid var(--line)}
.tot .dl dd{font-size:15px}
.tot .dl > div.strong dt{color:var(--fg);font-weight:700}.tot .dl > div.strong dd{font-size:20px}
.memo{padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--fg-2);line-height:1.7;white-space:pre-wrap}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}

/* overlay */
.ov{position:absolute;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end}
.ov.center{align-items:center;justify-content:center;padding:24px}
.panel{width:100%;max-height:82%;background:var(--elev);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.panel > header{display:flex;justify-content:space-between;align-items:center;padding:14px 8px 6px 16px}
.panel > header h3{font-size:15px}
.panel > header button{width:44px;height:44px;display:grid;place-items:center}
.panel .q{margin:4px 16px 8px;background:var(--raised);border:0;border-radius:12px;padding:0 14px;height:46px;font-size:16px}
.panel .q:focus{outline:none;box-shadow:inset 0 0 0 2px var(--fg)}
.mlist{overflow-y:auto;padding:0 16px 12px;min-height:120px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;min-height:52px;padding:8px 0}
.mrow + .mrow{border-top:1px solid var(--line)}
.mrow b{font-size:14px;font-weight:500;display:block}
.mrow small{font-size:11px;color:var(--fg-3)}
.mrow .st{color:var(--gold);font-size:13px;flex:none}
.mrow.new b{font-weight:700}
.dialog{background:var(--elev);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;width:100%}
.dialog b{font-size:16px} .dialog p{font-size:13px;color:var(--fg-2);line-height:1.7}
.dialog .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:absolute;z-index:50;left:16px;right:16px;bottom:calc(84px + var(--safe-b));background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.toast button{font-weight:700;min-height:32px;padding:0 8px;text-decoration:underline;text-underline-offset:3px}
.rules{display:flex;flex-direction:column;gap:14px}
.rules h3{font-size:13px;font-weight:700}
.rules .f{font-size:12.5px;color:var(--fg-2);line-height:1.8;background:var(--surface);border-radius:12px;padding:12px 14px}
.rules .f b{color:var(--fg);font-weight:500}
[hidden]{display:none!important}
.item .tt,.item .ss,.item > span,.mpick > span{display:block;min-width:0}
.kv3 .v{white-space:nowrap}

/* 会員カード（ホーム最上部） */
.member{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left}
.cardimg{display:block;position:relative;width:100%;aspect-ratio:856/540;border-radius:14px;overflow:hidden;background:#0c0c0e;box-shadow:var(--shadow)}
.cardimg img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.025)}
.cardimg.ph{display:flex;flex-direction:column;justify-content:space-between;padding:16px 18px;background:var(--raised);box-shadow:none}
.cardimg.ph .ph-k{font-family:var(--font-num);font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--fg-3)}
.cardimg.ph .ph-n{font-size:20px;font-weight:700;color:var(--fg)}
.cardimg.ph .ph-h{font-size:11px;color:var(--fg-3)}
.member-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:0 2px}
.member-name{min-width:0;display:flex;flex-direction:column;gap:1px}
.member-name .tt{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-name .ss{font-size:11.5px;color:var(--fg-3)}
.member-bal{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.member-bal .k{font-size:11px;color:var(--fg-3)} .member-bal .v{font-size:26px;line-height:1.15} .member-bal .d{font-size:11px;color:var(--fg-2)}
.cardpick{display:flex;align-items:center;gap:12px;position:relative}
.cardpick #sf-prev{width:150px;flex:none}
.cardpick .cardimg.ph{padding:10px;justify-content:center;align-items:center}
.banner.tap{display:block;width:100%;text-align:left;min-height:44px}
.banner b{font-weight:700;white-space:nowrap}
button.pill{min-height:28px}
.empty .btn{min-width:240px}
.legend i.lx{background:var(--fg)} .legend i.ls{background:var(--gold)} .legend i.ll{background:var(--fg-3);opacity:.5}
.field textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5;min-height:96px}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card .field textarea,.card .field input{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line-2)}
.card .field:focus-within textarea,.card .field:focus-within input{box-shadow:inset 0 0 0 2px var(--fg)}
.top-r{display:flex;align-items:center;gap:8px;flex:none}
.lookseg{display:inline-grid;grid-auto-flow:column;background:var(--raised);border-radius:999px;padding:2px}
.lookseg button{min-width:36px;height:28px;border-radius:999px;font-size:12px;font-weight:500;color:var(--fg-2)}
.lookseg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
.frow input.numin{font-family:var(--font-num);font-weight:var(--num-w);font-size:max(16px,calc(20px*var(--num-s)))}
.recon{margin:0 16px 12px;padding:12px 14px;border-radius:12px;background:var(--raised);display:flex;flex-direction:column;gap:8px}
.recon > header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.recon > header b{font-size:12.5px}
.recon .rl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;color:var(--fg-2)}
.recon .rl .num{font-size:14px;color:var(--fg)}
.recon .rl small{display:block;font-size:10.5px;color:var(--fg-3)}
.recon ul{display:flex;flex-direction:column;gap:6px;padding-top:2px}
.recon li,.issue{font-size:12px;line-height:1.6;padding:8px 10px;border-radius:8px;background:var(--gold-bg);color:var(--gold)}
.recon li.error,.issue.error{background:var(--red-bg);color:var(--red)}
.pill.ok{box-shadow:inset 0 0 0 1px var(--line-2);background:none;color:var(--fg)}
.hist{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.hist .he{font-size:12px;color:var(--fg-2);line-height:1.7;padding-left:12px;border-left:2px solid var(--line-2)}
.hist .he b{display:block;color:var(--fg);font-weight:500;font-size:12px}
.histbtn{margin:0 16px 12px;min-height:36px;font-size:12px;font-weight:700;text-align:left}
.stage.solo{grid-template-columns:auto;justify-content:center}
html::before{content:"";position:fixed;z-index:100;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#0c0c0c;pointer-events:none}
</style>
</head>

<script>
/* 収支計算（暫定案）。画面に依存しない純粋関数だけを置く。
   単位: 円は整数、メダルは整数枚。交換率は「100円あたりの枚数×10」の整数（5.6枚 → 56）で持つ。 */
const Calc = (() => {
  const n = v => (Number.isFinite(+v) ? Math.max(0, Math.round(+v)) : 0);
  const medalYen = (medals, exchX10) => medals * 1000 / exchX10;          // 交換レートでの円換算（未丸め）
  const lent = (cash, lendPer1000) => Math.round(n(cash) * lendPer1000 / 1000); // 現金で借りた枚数

  // 1台分
  function play(p, s) {
    const lentM = lent(p.cash, s.lendPer1000);
    const carryIn = n(p.carryIn), savedIn = n(p.savedIn), out = n(p.out), cash = n(p.cash);
    const inMedals = lentM + carryIn + savedIn;
    return {
      lent: lentM, inMedals,
      diff: out - inMedals,                                                // 差枚
      yen: Math.round(medalYen(out - carryIn - savedIn, s.exchX10)) - cash // 換算収支（交換レート評価）
    };
  }

  // 換金額の自動計算（100円単位で切り捨て）
  function autoCashOut(hand, deposit, exchX10) {
    const m = Math.max(0, n(hand) - n(deposit));
    return Math.floor(m * 10 / exchX10) * 100;
  }

  // 1実戦（1日×1店舗）
  function session(s) {
    const plays = s.plays.map(p => play(p, s));
    const sum = k => s.plays.reduce((a, p) => a + n(p[k]), 0);
    const cash = sum('cash'), savedIn = sum('savedIn'), carryIn = sum('carryIn'), out = sum('out'), minutes = sum('minutes');
    const hand = out - carryIn;                       // 最後に手元に残ったメダル
    const deposit = n(s.deposit), cashOut = n(s.cashOut), expense = n(s.expense);
    const exchMedals = hand - deposit;                // 交換に回したメダル
    const cashResult = cashOut - cash;                // 現金収支
    const savedDelta = deposit - savedIn;             // 貯メダル増減（枚）
    const savedYen = Math.round(medalYen(savedDelta, s.exchX10));
    const evalResult = cashResult + savedYen;         // 遊技収支（メダル評価込み）
    const machineSum = plays.reduce((a, p) => a + p.yen, 0);
    return {
      plays, cash, savedIn, carryIn, out, minutes, hand, deposit, cashOut, expense, exchMedals,
      lent: plays.reduce((a, p) => a + p.lent, 0),
      diff: plays.reduce((a, p) => a + p.diff, 0),
      cashResult, savedDelta, savedYen, evalResult, machineSum,
      gap: evalResult - machineSum,                   // 端数・景品差（台別合計との差）
      leftover: Math.max(0, Math.floor(exchMedals - cashOut * s.exchX10 / 1000))
    };
  }

  function validate(s, opt = {}) {
    const errors = [], warnings = [];
    if (!s.storeId) errors.push('店舗を選んでください');
    if (!s.plays.length) errors.push('台を1台以上追加してください');
    s.plays.forEach((p, i) => { if (!p.machineId) errors.push(`${i + 1}台目：機種を選んでください`); });
    let avail = 0;
    s.plays.forEach((p, i) => {

      if (n(a[k]) !== n(b[k])) lines.push(`${label}：${y(a[k])}${unit} → ${y(b[k])}${unit}`);

function lineChart(points, h = 120) {
  const W = 338, pl = 2, pr = 46, pt = 10, pb = 18;
  const vs = points.map(p => p.v); let mx = Math.max(0, ...vs), mn = Math.min(0, ...vs); if (mx === mn) mx += 1000;
  const x = i => pl + (points.length < 2 ? 0 : (W - pl - pr) * i / (points.length - 1));
  const y = v => pt + (h - pt - pb) * (mx - v) / (mx - mn);
  const path = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join('');
  const lx = x(points.length - 1), last = points[points.length - 1];
  const ticks = [mx, mn]; if (y(0) - y(mx) > 13 && y(mn) - y(0) > 13) ticks.push(0);
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="累計収支の推移。最新 ${compact(last.v)}円">
    <line class="zero" x1="${pl}" x2="${W - pr}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/>
    <path class="ar" d="${path}L${lx.toFixed(1)} ${y(0).toFixed(1)}L${x(0).toFixed(1)} ${y(0).toFixed(1)}Z"/>
    <path class="ln" d="${path}"/>
    <circle class="pt" cx="${lx.toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="4.5"/>
    ${ticks.map(t => `<text x="${W - pr + 9}" y="${(y(t) + 3.5).toFixed(1)}">${t === 0 ? '0' : compact(t)}</text>`).join('')}
    <text x="${pl}" y="${h - 3}">${esc(points[0].label)}</text><text x="${W - pr}" y="${h - 3}" text-anchor="end">${esc(last.label)}</text>
  </svg>`;
}
function barChart(items, h = 150) {
  const W = 338, showVals = items.length <= 12, pt = showVals ? 16 : 8, pb = showVals ? 30 : 18;
  const vs = items.map(p => p.v); let mx = Math.max(0, ...vs), mn = Math.min(0, ...vs); if (mx === mn) mx = 1;
  const band = W / items.length, bw = Math.min(30, band * 0.64);

  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="収支の棒グラフ">
    ${items.map((p, i) => {
      const cx = i * band + band / 2, top = Math.min(y(p.v), y(0)), hh = Math.max(p.v === 0 ? 0 : 1.5, Math.abs(y(p.v) - y(0)));
      return (p.v !== 0 ? `<rect class="${p.v > 0 ? 'bp' : 'bn'}" x="${(cx - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="${Math.min(2.5, bw / 2)}"/>` : '')
        + (showVals && p.has ? `<text class="${p.v > 0 ? 'tp' : p.v < 0 ? 'tn' : ''}" x="${cx.toFixed(1)}" y="${(p.v >= 0 ? y(p.v) - 4 : y(p.v) + 11).toFixed(1)}" text-anchor="middle">${compact(p.v) || '0'}</text>` : '')

/* ---------- sheets ---------- */
function draftRates() {
  const d = S.draft, st = storeOf(d.storeId);
  if (d.snap && d.snap.storeId === d.storeId) return { lendPer1000: d.snap.lendPer1000, exchX10: d.snap.exchX10 };
  return st ? { lendPer1000: st.lendPer1000, exchX10: st.exchX10 } : { lendPer1000: 47, exchX10: 50 };
}
function draftSession() {
  const d = S.draft, r = draftRates();
  const s = { id: d.id, date: d.date, storeId: d.storeId, ...r, plays: d.plays.map(p => ({ machineId: p.machineId, cash: Calc.n(p.cash), savedIn: Calc.n(p.savedIn), carryIn: Calc.n(p.carryIn), out: Calc.n(p.out), minutes: Calc.n(p.minutes) })), deposit: Calc.n(d.deposit), expense: Calc.n(d.expense), memo: d.memo.trim() };
  const hand = s.plays.reduce((a, p) => a + p.out - p.carryIn, 0);
  s.cashOut = d.manual ? Calc.n(d.cashOut) : Calc.autoCashOut(hand, s.deposit, s.exchX10);
  return s;
}
const draftUsedToday = () => { const d = S.draft; return db.sessions.filter(x => x.id !== d.id && x.date === d.date && x.storeId === d.storeId).reduce((a, x) => a + x.plays.reduce((b, p) => b + Calc.n(p.savedIn), 0), 0); };
const vopts = () => ({ balance: draftBalance(), dailyLimit: storeOf(S.draft.storeId)?.dailyLimit || 0, usedToday: draftUsedToday() });
const draftBalance = () => { const d = S.draft; return d.storeId ? (Calc.balances(db.stores, db.sessions.filter(x => x.id !== d.id))[d.storeId] || 0) : 0; };
function numField(label, unit, f, val) {
  const id = 'f-' + f.replace(/\./g, '-');
  return `<label class="nf" for="${id}"><span>${label}</span><span class="nfi"><input id="${id}" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-f="${f}" data-num value="${fin(val)}" placeholder="0"><i>${unit}</i></span></label>`;
}
function openEntry(o = {}) {
  let d;
  const src = o.id && db.sessions.find(x => x.id === o.id);
  if (src && o.copy) d = { id: null, date: TODAY(), storeId: src.storeId, plays: src.plays.map(p => ({ ...blankPlay(), machineId: p.machineId })), deposit: 0, cashOut: 0, manual: false, expense: src.expense, memo: '', more: !!src.expense, snap: null };
  else if (src) { const c = Calc.session(src); d = { id: src.id, date: src.date, storeId: src.storeId, plays: src.plays.map(p => ({ ...p })), deposit: src.deposit, cashOut: src.cashOut, manual: src.cashOut !== Calc.autoCashOut(c.hand, src.deposit, src.exchX10), expense: src.expense, memo: src.memo || '', more: !!(src.expense || src.memo || c.minutes), snap: { storeId: src.storeId, lendPer1000: src.lendPer1000, exchX10: src.exchX10 } }; }
  else { d = { id: null, date: o.date || TODAY(), storeId: o.storeId || mainStore()?.id || '', plays: [blankPlay()], deposit: 0, cashOut: 0, manual: false, expense: 0, memo: '', more: false, snap: null }; }
  S.draft = d; S.tried = false; S.sheet = { type: 'entry' }; S.enter = true; renderSheet();
}
const sheets = {
  entry() {

function updateLive() {
  const d = S.draft; if (!d || S.sheet?.type !== 'entry') return;
  const s = draftSession(), c = Calc.session(s), vo = vopts();
  let avail = 0;
  d.plays.forEach((p, i) => {
    const el = $('#pres-' + i), cp = c.plays[i], sp = s.plays[i];
    if (el) el.innerHTML = (sp.cash + sp.carryIn + sp.savedIn + sp.out) ? `<span>投入 ${nf(cp.inMedals)}枚・差枚 ${Y(cp.diff, { unit: '枚' })}</span>${Y(cp.yen)}` : '<span>金額と枚数を入れると、差枚と収支を自動で計算します</span>';
    const cb = $('#carry-' + i);
    if (cb) { cb.textContent = `前の台までの ${nf(avail)}枚を全部入れる`; cb.dataset.v = avail; cb.hidden = avail <= 0; }
    avail += sp.out - sp.carryIn;
    const sb = $('#sv-' + i), sl = $('#svl-' + i);
    if (sb) {
      const others = c.savedIn - sp.savedIn, room = Math.max(0, Math.min(vo.balance - others, vo.dailyLimit > 0 ? vo.dailyLimit - vo.usedToday - others : Infinity));
      sb.textContent = `${nf(room)}枚を使う`; sb.dataset.v = room; sb.hidden = room <= 0 || sp.savedIn === room;
      sl.textContent = vo.dailyLimit > 0 ? `本日あと ${nf(Math.max(0, vo.dailyLimit - vo.usedToday - c.savedIn))}枚（1日 ${nf(vo.dailyLimit)}枚まで）` : '';
    }
  });
  $('#st-hand').innerHTML = N(Math.max(0, c.hand), '枚');
  const co = $('#f-cashOut'); if (co && !d.manual && document.activeElement !== co) co.value = fin(s.cashOut);
  $('#st-auto').hidden = !d.manual;
  $('#st-autolab').textContent = d.manual ? '手入力した金額を使っています' : '交換率から自動で計算しています';
  const ex = Math.max(0, c.exchMedals - c.leftover), tot = Math.max(1, ex + c.deposit + c.leftover);
  $('#st-bar').innerHTML = c.hand > 0 ? `<span class="x" style="width:${ex / tot * 100}%"></span><span class="s" style="width:${c.deposit / tot * 100}%"></span><span class="l" style="width:${c.leftover / tot * 100}%"></span>` : '';
  $('#st-leg').innerHTML = `<span><i class="lx"></i>換金 ${nf(ex)}枚</span><span><i class="ls"></i>貯メダル ${nf(c.deposit)}枚</span><span><i class="ll"></i>端数 ${nf(c.leftover)}枚</span>`;
  const main = S.basis === 'cash' ? c.cashResult : c.evalResult;
  $('#entry-res').innerHTML = `<span class="k">${S.basis === 'cash' ? '現金収支' : '遊技収支（メダル評価込み）'}</span><span class="v">${Y(main, { arrow: true })}</span><span class="d">${S.basis === 'cash' ? `貯メダル ${sign(c.savedDelta)}${nf(Math.abs(c.savedDelta))}枚` : `うち現金 ${sign(c.cashResult)}${nf(Math.abs(c.cashResult))}円`}</span>`;
  const a = Calc.audit(s, vopts());
  $('#entry-msgs').innerHTML = a.issues.filter(x => x.level !== 'error' || S.tried).map(x => `<p class="issue ${x.level}"${x.level === 'error' ? ' role="alert"' : ''}>${esc(x.msg)}</p>`).join('');
}

function mlistHTML() {
  const q = norm(S.picker.q || ''), cnt = new Map(Calc.byMachine(db.sessions).map(r => [r.id, r.n]));
  const list = db.machines.filter(m => !q || norm(m.name + (m.maker || '')).includes(q)).sort((a, b) => (b.fav - a.fav) || ((cnt.get(b.id) || 0) - (cnt.get(a.id) || 0)));
  const exact = db.machines.some(m => norm(m.name) === q);
  return list.map(m => `<button class="mrow" data-act="chooseMachine" data-id="${m.id}"><span><b>${esc(m.name)}</b><small>${esc([m.maker, m.type].filter(Boolean).join('・') || '分類未設定')}・${cnt.get(m.id) || 0}回</small></span>${m.fav ? '<span class="st" aria-label="お気に入り">★</span>' : ''}</button>`).join('')
    + (q && !exact ? `<button class="mrow new" data-act="newMachine"><span><b>「${esc(S.picker.q.trim())}」を新しい機種として追加</b><small>メーカーや分類はあとで設定できます</small></span></button>` : '')
    + (!list.length && !q ? '<p class="hint" style="padding:16px 0">機種がまだありません。名前を入力して追加してください。</p>' : '');

let lastTab = null;

    k === 'add' ? `<button class="tab add" data-act="tab" data-tab="add" aria-label="実戦を記録"><span class="fab">${svg('plus')}</span></button>`
      : `<button class="tab" data-act="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${svg(k)}<span>${l}</span></button>`).join('');

}
function renderSheet() {
  persist();

  if (S.picker) { host.innerHTML = `<div class="ov" data-ov="picker"><div class="panel" role="dialog" aria-modal="true"><header><h3>機種を選ぶ</h3><button data-act="closePicker" aria-label="閉じる">${svg('close')}</button></header><input class="q" id="mq" type="search" data-q placeholder="機種名・メーカーで検索、または新しい機種名" autocomplete="off" value="${esc(S.picker.q)}"><div class="mlist" id="mlist">${mlistHTML()}</div></div></div>`; return; }

function loadBackup(text) {
  if (S.sheet?.type !== 'backup') return;
  if (!text.trim()) { S.sheet.error = 'バックアップの内容がありません。ファイルを選ぶか、テキストを貼り付けてください。'; renderSheet(); return; }
  const r = parseBackup(text);
  if (r.error) { S.sheet.error = r.error; renderSheet(); return; }
  S.sheet.error = ''; S.incoming = r;
  const when = r.exportedAt && !isNaN(Date.parse(r.exportedAt)) ? fmtTime(Date.parse(r.exportedAt)) + ' に書き出した' : '';
  S.confirm = { title: 'このバックアップで置き換えますか？', msg: `${when}バックアップ（記録 ${r.data.sessions.length}件${r.skipped ? `・読めなかった記録 ${r.skipped}件は除外` : ''}）を読み込みます。${mine ? `いまの自分の記録 ${mine.sessions.length}件は置き換えられます。` : ''}直後なら「元に戻す」で戻せます。`, ok: '置き換える', act: 'doRestore', danger: !!(mine && mine.sessions.length) };
  renderOverlay();
}
let toastTimer;
function toast(msg, label, act) {
  $('#toast').innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${label ? `<button data-act="${act}">${esc(label)}</button>` : ''}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('#toast').innerHTML = ''; }, label ? 6000 : 2200);
}
const closeSheet = () => { S.sheet = null; S.draft = null; S.picker = null; };
function applyTheme() { document.documentElement.dataset.theme = S.look === 'light' ? 'light' : 'dark'; }
function commit(force) {
  const d = S.draft, s = draftSession(); S.tried = true;
  const v = Calc.validate(s, vopts());
  if (v.errors.length) { updateLive(); const b = $('.sh-body'); b.scrollTop = b.scrollHeight; return; }
  const key = x => JSON.stringify([x.date, x.storeId, x.plays.map(p => [p.machineId, p.cash, p.savedIn, p.carryIn, p.out]), x.deposit, x.cashOut]);
  if (!d.id && !force && db.sessions.some(x => key(x) === key(s))) { S.confirm = { title: '同じ内容の記録があります', msg: '日付と台の内容がまったく同じ記録がすでにあります。重複して保存しますか？', ok: '保存する', act: 'saveForce' }; renderOverlay(); return; }
  const now = Date.now();
  if (d.id) {
    const i = db.sessions.findIndex(x => x.id === d.id), old = db.sessions[i], before = JSON.parse(JSON.stringify(old)); delete before.history;
    s.createdAt = old.createdAt || 0; s.updatedAt = now;
    s.history = Calc.diffSession(before, s).length ? (old.history || []).concat([{ at: now, before }]).slice(-20) : (old.history || []);
    db.sessions[i] = s;
  } else { s.id = uid(); s.createdAt = now; db.sessions.push(s); }
  S.confirm = null; S.cal = s.date.slice(0, 7);
  const back = S.back; closeSheet(); if (back) { S.sheet = { type: 'day', date: s.date }; }
  if (!d.id && !back) S.tab = 'home';
  S.back = null; render(); toast(d.id ? '変更を保存しました' : '記録を保存しました');
}

/* ---------- actions ---------- */
const A = {
  tab(el) { if (el.dataset.tab === 'add') { S.back = null; return openEntry(); } closeSheet(); S.tab = el.dataset.tab; if (S.tab === 'cal') S.cal = S.cal || TODAY().slice(0, 7); render(); },
  period(el) { S.period = el.dataset.p; render(); },
  theme(el) { S.look = el.dataset.t; applyTheme(); render(); },
  calMove(el) { if (el.disabled) return; S.cal = addMonth(S.cal, +el.dataset.k); render(); },
  day(el) { S.sheet = { type: 'day', date: el.dataset.date }; S.enter = true; renderSheet(); },
  toggleHist(el) { S.sheet.hist = S.sheet.hist === el.dataset.id ? null : el.dataset.id; renderSheet(); },
  auditSheet() { S.sheet = { type: 'audit' }; S.enter = true; renderSheet(); },
  newOn(el) { S.back = S.sheet?.type === 'day'; openEntry({ date: el.dataset.date }); },
  editRec(el) { S.back = true; openEntry({ id: el.dataset.id }); },
  copyRec(el) { S.back = false; openEntry({ id: el.dataset.id, copy: true }); toast('機種を引き継いで新しい記録を作成します'); },
  closeSheet() { const back = S.sheet?.type === 'entry' && S.back && S.draft ? S.draft.date : null; closeSheet(); S.back = null; if (back && db.sessions.some(s => s.date === back)) S.sheet = { type: 'day', date: back }; render(); },
  rules() { S.sheet = { type: 'rules' }; S.enter = true; renderSheet(); },
  addPlay() { S.draft.plays.push(blankPlay()); renderSheet(); const b = $('.sh-body'), card = b.querySelectorAll('.pcard')[S.draft.plays.length - 1]; if (card) { const k = b.offsetHeight / (b.getBoundingClientRect().height || 1); b.scrollTop += (card.getBoundingClientRect().top - b.getBoundingClientRect().top) * k - 12; } },
  delPlay(el) { S.draft.plays.splice(+el.dataset.i, 1); renderSheet(); },
  moreFields() { S.draft.more = true; renderSheet(); },
  cashAdd(el) { const p = S.draft.plays[+el.dataset.i]; p.cash = Math.min(9999999, Calc.n(p.cash) + +el.dataset.v); $(`#f-p-${el.dataset.i}-cash`).value = fin(p.cash); updateLive(); },
  savedMax(el) { const p = S.draft.plays[+el.dataset.i]; p.savedIn = +el.dataset.v; $(`#f-p-${el.dataset.i}-savedIn`).value = fin(p.savedIn); updateLive(); },
  carryAll(el) { const p = S.draft.plays[+el.dataset.i]; p.carryIn = +el.dataset.v; $(`#f-p-${el.dataset.i}-carryIn`).value = fin(p.carryIn); updateLive(); },
  depSet(el) { const d = S.draft, hand = d.plays.reduce((a, p) => a + Calc.n(p.out) - Calc.n(p.carryIn), 0); d.deposit = el.dataset.v === 'all' ? Math.max(0, hand) : 0; $('#f-deposit').value = fin(d.deposit); updateLive(); },
  cashAuto() { S.draft.manual = false; updateLive(); },
  pickMachine(el) { S.picker = { i: +el.dataset.i, q: '' }; renderOverlay(); },
  closePicker() { S.picker = null; renderOverlay(); },
  chooseMachine(el) { S.draft.plays[S.picker.i].machineId = el.dataset.id; S.picker = null; renderOverlay(); renderSheet(); },
  newMachine() { const name = S.picker.q.trim(); if (!name) return; let m = db.machines.find(x => norm(x.name) === norm(name)); if (!m) { m = { id: uid(), name, maker: '', type: '', fav: false }; db.machines.push(m); } S.draft.plays[S.picker.i].machineId = m.id; S.picker = null; renderOverlay(); renderSheet(); toast(`「${name}」を追加しました`); },
  fav(el) { const m = machineOf(el.dataset.id); m.fav = !m.fav; render(); },
  save() { commit(false); },
  saveForce() { commit(true); },
  cancelConfirm() { S.confirm = null; renderOverlay(); },
  askDel(el) { S.confirm = { title: 'この記録を削除しますか？', msg: '削除した直後なら「元に戻す」で復元できます。', ok: '削除する', act: 'doDel', danger: true, id: el.dataset.id }; renderOverlay(); },
  doDel() { const t = db, i = t.sessions.findIndex(x => x.id === S.confirm.id); const [gone] = t.sessions.splice(i, 1); S.undo = () => { t.sessions.splice(i, 0, gone); }; S.confirm = null; if (S.sheet?.type === 'day' && !db.sessions.some(x => x.date === S.sheet.date)) S.sheet = null; render(); toast('記録を削除しました', '元に戻す', 'undo'); },
  undo() { if (!S.undo) return; S.undo(); S.undo = null; render(); toast('元に戻しました'); },
  editStore(el) { const s = storeOf(el.dataset.id) || mainStore(); S.sd = { id: s.id, lend: String(s.lendPer1000), exch: String(s.exchX10), limit: String(s.dailyLimit || ''), init: String(s.initSaved || ''), card: s.card || '' }; S.prevSheet = S.sheet; S.sheet = { type: 'store' }; S.enter = true; renderSheet(); },
  storeView(el) { S.sheet = { type: 'storeView', id: el.dataset.id }; S.enter = true; renderSheet(); },
  closeStore() { S.sheet = S.prevSheet || null; S.prevSheet = null; S.sd = null; S.enter = false; render(); },
  saveStore() {
    const d = S.sd, lend = parseInt(d.lend, 10), exch = parseInt(d.exch, 10), errs = [];
    if (!(lend >= 1 && lend <= 250) || String(lend) !== d.lend.trim()) errs.push('貸出枚数は1〜250の整数で入力してください');
    if (!(exch >= 10 && exch <= 500) || String(exch) !== d.exch.trim()) errs.push('交換枚数は10〜500の整数で入力してください（例：50枚で1,000円なら 50）');
    if (errs.length) { $('#store-msg').innerHTML = errs.map(e => `<p class="banner err" role="alert" style="margin-bottom:8px">${esc(e)}</p>`).join(''); return; }
    Object.assign(storeOf(d.id), { lendPer1000: lend, exchX10: exch, dailyLimit: Calc.n(d.limit), initSaved: Calc.n(d.init), card: d.card });
    A.closeStore(); toast('条件を保存しました');
  },
  askMine() { S.confirm = { title: '自分の記録を始めますか？', msg: 'サンプルとは別に、空の状態から記録を始めます。記録はこの端末（このブラウザ）に保存されます。サンプルは「その他」からいつでも見られます。', ok: '始める', act: 'useMine' }; renderOverlay(); },
  useMine() { const first = !mine; if (first) mine = newMine(); try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (_) {} db = mine; S.mode = 'mine'; S.confirm = null; S.undo = null; closeSheet(); if (first) S.tab = 'home'; S.cal = TODAY().slice(0, 7); render(); toast(first ? '自分の記録を作成しました' : '自分の記録を表示しています'); },
  useSample() { if (S.mode === 'sample') return; sample = sample || sampleDB(); db = sample; S.mode = 'sample'; S.undo = null; closeSheet(); S.cal = TODAY().slice(0, 7); render(); toast('サンプルを表示しています'); },
  askReset() { S.confirm = { title: 'サンプルを最初の状態に戻しますか？', msg: 'サンプルの記録・機種・条件を作り直します。自分の記録には影響しません。', ok: '戻す', act: 'doReset' }; renderOverlay(); },
  doReset() { sample = sampleDB(); db = sample; S.mode = 'sample'; S.confirm = null; S.undo = null; closeSheet(); S.cal = TODAY().slice(0, 7); render(); toast('サンプルを最初の状態に戻しました'); },
  askClear() { S.confirm = { title: 'サンプルの記録を空にしますか？', msg: '記録が0件のときの表示を確認できます。自分の記録には影響しません。', ok: '空にする', act: 'doClear' }; renderOverlay(); },
  doClear() { sample = sample || sampleDB(); sample.sessions = []; db = sample; S.mode = 'sample'; S.confirm = null; S.undo = null; closeSheet(); render(); toast('サンプルを空にしました'); },
  askWipe() { if (S.mode !== 'mine') return; S.confirm = { title: `自分の記録 ${mine.sessions.length}件をすべて消しますか？`, msg: '実戦の記録をすべて削除します。機種と条件は残ります。消した直後なら「元に戻す」で復元できますが、ページを閉じると戻せません。', ok: 'すべて消す', act: 'doWipe', danger: true }; renderOverlay(); },
  doWipe() { if (S.mode !== 'mine') return; const m = mine, prev = m.sessions; m.sessions = []; S.undo = () => { m.sessions = prev; }; S.confirm = null; closeSheet(); render(); toast('自分の記録を消しました', '元に戻す', 'undo'); },
  backup() { S.sheet = { type: 'backup', text: '', error: '' }; S.enter = true; renderSheet(); },
  exportFile() {
    if (!mine) return; const text = backupText(), name = backupName();
    const manual = () => { const a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); markBackup('書き出しを始めました。保存されないときは「テキストをコピー」を使ってください'); };
    if (DL) { DL.save({ filename: name, data: text }).then(() => markBackup('バックアップを書き出しました'), e => toast(e && e.code === 'declined' ? '書き出しを取り消しました' : 'ファイルに保存できませんでした。「テキストをコピー」を使ってください')); return; }
    try { const f = new File([text], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f] }).then(() => markBackup('バックアップを書き出しました'), e => { if (!e || e.name !== 'AbortError') manual(); }); return; } } catch (_) {}
    manual();
  },
  copyBackup() {
    if (!mine) return; const text = backupText(), show = () => { S.sheet.text = text; renderSheet(); const t = $('#bk-out'); if (t) { t.focus(); t.select(); } };
    try { navigator.clipboard.writeText(text).then(() => markBackup('バックアップをコピーしました。メモなどに貼り付けて保管してください'), show); } catch (_) { show(); }
  },
  readPasted() { loadBackup(($('#bk-in') || {}).value || ''); },
  doRestore() {
    const inc = S.incoming; if (!inc) return; const prev = { mine, mode: S.mode, budget: S.budget };
    mine = inc.data; db = mine; S.mode = 'mine'; if (inc.budget) S.budget = inc.budget; S.incoming = null; S.confirm = null;
    S.undo = () => { mine = prev.mine; S.mode = prev.mine && prev.mode === 'mine' ? 'mine' : 'sample'; S.budget = prev.budget; if (S.mode === 'mine') db = mine; else { sample = sample || sampleDB(); db = sample; } };
    closeSheet(); S.tab = 'home'; S.cal = TODAY().slice(0, 7); render(); toast(`記録 ${mine.sessions.length}件を復元しました`, '元に戻す', 'undo');
  }
};

document.addEventListener('click', e => {
  const ov = e.target.dataset?.ov;
  if (ov === 'picker') return A.closePicker();
  if (ov === 'confirm') return A.cancelConfirm();
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (fn) fn(el, e);
});
const digits = v => v.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^\d]/g, '').slice(0, 7);
document.addEventListener('input', e => {
  const el = e.target, d = S.draft;
  if (el.dataset.f && d) {
    const f = el.dataset.f;
    if (f === 'date') { if (el.value) d.date = el.value; updateLive(); return; }
    if (f === 'memo') { d.memo = el.value; return; }
    const v = digits(el.value); if (v !== el.value) el.value = v;
    const num = v === '' ? 0 : parseInt(v, 10);
    if (f.startsWith('p.')) { const [, i, k] = f.split('.'); d.plays[+i][k] = num; } else { d[f] = num; if (f === 'cashOut') d.manual = v !== ''; }
    updateLive();
  } else if (el.dataset.q != null && S.picker) { S.picker.q = el.value; $('#mlist').innerHTML = mlistHTML(); }
  else if (el.dataset.sf && S.sd) { const v = digits(el.value); if (v !== el.value) el.value = v; S.sd[el.dataset.sf] = v; }
  else if (el.id === 'f-budget') { const v = digits(el.value); if (v !== el.value) el.value = v; S.budget = v === '' ? 0 : parseInt(v, 10); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'f-budget') render();
  if (e.target.id === 'bk-file' && e.target.files[0]) { const fr = new FileReader(); fr.onload = () => loadBackup(String(fr.result || '')); fr.onerror = () => { if (S.sheet?.type === 'backup') { S.sheet.error = 'ファイルを読み込めませんでした。'; renderSheet(); } }; fr.readAsText(e.target.files[0]); }
  if (e.target.id === 'sf-card' && e.target.files[0] && S.sd) {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, 900 / im.width), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      if (S.sd) { S.sd.card = c.toDataURL('image/jpeg', 0.82); const pv = $('#sf-prev'); if (pv) pv.innerHTML = `<span class="cardimg"><img src="${S.sd.card}" alt="会員カードのプレビュー"></span>`; }
    }; im.onerror = () => toast('画像を読み込めませんでした。別の画像を選んでください'); im.src = fr.result; };
    fr.readAsDataURL(e.target.files[0]);
  }
});
document.addEventListener('focusin', e => { if (e.target.dataset?.num != null) { const el = e.target, v = digits(el.value); if (v !== el.value) el.value = v; if (v) setTimeout(() => { try { if (document.activeElement === el) el.setSelectionRange(0, el.value.length); } catch (_) {} }, 0); }
  if (matchMedia('(max-width:860px)').matches && e.target.matches('.sh-body input,.sh-body textarea')) setTimeout(() => e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 280); });
document.addEventListener('focusout', e => { if (e.target.dataset?.num != null) e.target.value = fin(digits(e.target.value)); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.confirm) A.cancelConfirm(); else if (S.picker) A.closePicker(); else if (S.sheet?.type === 'store') A.closeStore(); else if (S.sheet) A.closeSheet(); } });

/* ---------- boot ---------- */
function fit() { const w = $('.device-wrap'); if (matchMedia('(max-width:860px)').matches) w.style.removeProperty('--s'); else w.style.setProperty('--s', Math.max(0.55, Math.min(1, (innerHeight - 48) / 894)).toFixed(3)); }
function tick() { const d = new Date(); $('#clock').textContent = `${d.getHours()}:${pad(d.getMinutes())}`; }
function start(data) {
  const saved = restore(), keep = (data && data.S) || {};
  S = Object.assign({ tab: 'home', period: 'all', cal: TODAY().slice(0, 7) }, keep, { basis: 'eval', mode: 'sample', budget: 80000, look: 'dark' },
    saved ? { mode: saved.mode === 'mine' && saved.mine ? 'mine' : 'sample', budget: Calc.n(saved.settings?.budget) || 80000, look: saved.settings?.look2 === 'light' ? 'light' : 'dark' } : {},
    { sheet: null, draft: null, picker: null, confirm: null, sd: null, undo: null, back: null, tried: false, enter: false });
  mine = saved ? saved.mine : null;
  if (S.mode === 'mine') db = mine; else { sample = sampleDB(); db = sample; }
  applyTheme(); fit(); tick(); render();
  if (store.broken) toast('保存データを読み込めなかったため、サンプルを表示しています');
}
addEventListener('resize', fit); setInterval(tick, 20000);
addEventListener('pagehide', () => { if (S) persist(); });
try { window.claude?.hot?.snapshot?.(() => ({ S: { tab: S.tab, period: S.period, cal: S.cal } })); } catch (_) {}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
window.__demo = { get db() { return db; }, get S() { return S; }, get mine() { return mine; }, get store() { return store; }, KEY, backupText, parseBackup };
})();
</script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
